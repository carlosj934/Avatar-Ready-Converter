<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Ready Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .supported-formats {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 12px;
      margin-bottom: 30px;
      border-radius: 4px;
      font-size: 13px;
    }

    .supported-formats strong {
      color: #667eea;
    }

    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #f0f3ff;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      color: #667eea;
      font-weight: 600;
      cursor: pointer;
    }

    .file-info {
      margin-top: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 4px;
      font-size: 14px;
      color: #2e7d32;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .option-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }

    select {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    #status.show {
      display: block;
    }

    #status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    #status.processing {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #0c5460;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ Avatar Ready Converter</h1>
    <p class="subtitle">Transform any image into a perfect square avatar</p>

    <div class="supported-formats">
      <strong>📥 Accepts:</strong> JPG, PNG, GIF, WebP<br>
      <strong>📤 Outputs:</strong> JPG (smaller) or PNG (higher quality)
    </div>

    <form id="uploadForm">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <p>
          <span class="file-label">Click to select</span> or drag and drop an image here
        </p>
        <p style="font-size: 12px; color: #999; margin-top: 8px;">Maximum file size: 10MB</p>
        <input type="file" id="fileInput" accept="image/*" required>
      </div>

      <div id="fileInfo" class="file-info" style="display: none;"></div>

      <div class="options">
        <div class="option-group">
          <label for="formatSelect">Output Format</label>
          <select id="formatSelect">
            <option value="jpg">JPG (smaller file)</option>
            <option value="png">PNG (better quality)</option>
          </select>
        </div>

        <div class="option-group">
          <label for="sizeSelect">Avatar Size</label>
          <select id="sizeSelect">
            <option value="256">256×256 px</option>
            <option value="512" selected>512×512 px</option>
            <option value="1024">1024×1024 px</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn">
        🚀 Process Image
      </button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const fileInfo = document.getElementById('fileInfo');
    const formatSelect = document.getElementById('formatSelect');
    const sizeSelect = document.getElementById('sizeSelect');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    // Click to upload
    uploadArea.addEventListener('click', () => fileInput.click());

    // File selection
    fileInput.addEventListener('change', handleFileSelect);

    // Drag and drop
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        handleFileSelect();
      }
    });

    function handleFileSelect() {
      const file = fileInput.files[0];
      if (file) {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        fileInfo.textContent = `✓ Selected: ${file.name} (${sizeMB} MB)`;
        fileInfo.style.display = 'block';
      }
    }

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) {
        showStatus('Please select a file', 'error');
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        showStatus('File too large. Maximum size is 10MB', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('output_format', formatSelect.value);
      formData.append('size', sizeSelect.value);

      submitBtn.disabled = true;
      showStatus('<span class="spinner"></span>Processing your image...', 'processing');

      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Processing failed');
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `avatar-${sizeSelect.value}x${sizeSelect.value}.${formatSelect.value}`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);

        showStatus('✓ Success! Your avatar has been downloaded.', 'success');
        
        // Reset form
        setTimeout(() => {
          fileInput.value = '';
          fileInfo.style.display = 'none';
          status.classList.remove('show');
        }, 3000);

      } catch (error) {
        showStatus(`✗ Error: ${error.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    function showStatus(message, type) {
      status.innerHTML = message;
      status.className = `show ${type}`;
    }
  </script>
</body>
</html>
