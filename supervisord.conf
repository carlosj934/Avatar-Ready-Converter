[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[program:go-processor]
command=/app/go-processor/processor
directory=/app/go-processor
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=appuser
priority=100
environment=GO_PORT="8080",MAX_FILE_SIZE="10485760",PROCESSING_TIMEOUT="30"

[program:rails-api]
command=bundle exec puma -C config/puma.rb
directory=/app/rails-api
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=appuser
priority=200
environment=RAILS_ENV="production",GO_SERVICE_URL="http://localhost:8080",PORT="3000",RAILS_SERVE_STATIC_FILES="true",RAILS_LOG_TO_STDOUT="true",SECRET_KEY_BASE="%(ENV_SECRET_KEY_BASE)s"
